<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas | Bella Afrodita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-color: #db2777; --wholesale-color: #0ea5e9; --bg-light: #f8f9fa; --expense-color: #ef4444; }
        body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .navbar { background: white; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .nav-link { font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-link.active { color: var(--primary-color) !important; border-bottom-color: var(--primary-color); }
        .section { display: none; padding: 20px 0; }
        .section.active { display: block; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 1rem; }
        .txt-minorista { color: var(--primary-color); font-weight: 700; }
        .txt-mayorista { color: var(--wholesale-color); font-weight: 700; }
        .stock-critical { background-color: #dc2626 !important; color: white !important; font-weight: bold; }
        .stock-warning { background-color: #d97706 !important; color: white !important; font-weight: bold; }
        .fila-critica { background-color: #fee2e2 !important; }
        .fila-advertencia { background-color: #ffedd5 !important; }
        .search-group { position: relative; }
        .search-group .bi-search { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; z-index: 5; }
        .search-input { padding-left: 40px !important; border-radius: 10px !important; border: 1px solid #ddd; height: 50px; font-size: 16px !important; }
        #productResults, #purchaseProductResults { top: 55px; left: 0; border-radius: 12px; overflow: hidden; border: 1px solid #ddd; z-index: 2000; width: 100%; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .list-group-item-action { cursor: pointer; border: none; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-action { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; transition: 0.2s; border: 1px solid #eee; background: white; }
        .balance-card { border-left: 5px solid; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top navbar-light">
    <div class="container">
        <a class="navbar-brand fw-bold text-uppercase" style="color: var(--primary-color);">Bella Afrodita</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-2 mt-3 mt-lg-0 text-center">
                <li class="nav-item"><a class="nav-link active" id="link-inicio" onclick="showSection('inicio')">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" id="link-inventario" onclick="showSection('inventario')">Inventario</a></li>
                <li class="nav-item"><a class="nav-link" id="link-compras" onclick="showSection('compras')">Compras</a></li>
                <li class="nav-item"><a class="nav-link" id="link-historial" onclick="showSection('historial')">Historial</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <section id="inicio" class="section active">
        <div class="row g-3 mb-4">
            <div class="col-12"><h5 class="fw-bold"><i class="bi bi-calendar3 me-2"></i>Balance de <span id="month-name">...</span></h5></div>
            <div class="col-6 col-md-3">
                <div class="card p-3 bg-white balance-card border-success h-100">
                    <span class="text-muted small fw-bold">GANANCIA NETA</span>
                    <h3 id="net-balance" class="text-success fw-bold mb-0">$0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 bg-white balance-card border-primary h-100">
                    <span class="text-muted small fw-bold">RECAUDACIÓN</span>
                    <h3 id="total-recap" class="text-primary fw-bold mb-0">$0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 bg-white balance-card border-danger h-100">
                    <span class="text-muted small fw-bold">EGRESOS (PROV)</span>
                    <h3 id="total-expenses" class="text-danger fw-bold mb-0">$0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 bg-white balance-card border-info h-100">
                    <span class="text-muted small fw-bold">VENTAS</span>
                    <h3 id="sales-count" class="text-info fw-bold mb-0">0</h3>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-cart-plus me-2"></i>Nueva Venta</h5>
            <form id="saleForm">
                <div class="row g-2">
                    <div class="col-12 col-md-8 position-relative">
                        <div class="search-group">
                            <i class="bi bi-search"></i>
                            <input type="text" id="saleSearchProduct" class="form-control search-input" placeholder="Buscar producto para vender..." autocomplete="off">
                        </div>
                        <div id="productResults" class="list-group d-none shadow position-absolute"></div>
                        <input type="hidden" id="productSelect">
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="number" id="quantity" class="form-control form-control-lg text-center" placeholder="Cant." min="1" required style="height: 50px;">
                    </div>
                    <div class="col-6 col-md-2">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">VENDER</button>
                    </div>
                </div>
                <div id="selectedProductLabel" class="mt-3 p-2 bg-light rounded border d-none">
                    <span id="currentSelectionName"></span>
                </div>
            </form>
        </div>
    </section>

    <section id="compras" class="section">
        <div class="card p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-truck me-2"></i>Registrar Compra al Proveedor</h5>
            <form id="purchaseForm">
                <div class="row g-2">
                    <div class="col-12 col-md-5 position-relative">
                        <input type="text" id="purchaseSearchProduct" class="form-control form-control-lg" placeholder="Producto comprado..." autocomplete="off">
                        <div id="purchaseProductResults" class="list-group d-none shadow position-absolute"></div>
                        <input type="hidden" id="purchaseProductSelect">
                    </div>
                    <div class="col-6 col-md-3">
                        <input type="number" id="purchasePacks" class="form-control form-control-lg" placeholder="Cant. Packs" required>
                    </div>
                    <div class="col-6 col-md-4">
                        <input type="number" step="0.01" id="purchaseTotalCost" class="form-control form-control-lg" placeholder="Costo Total $" required>
                    </div>
                    <div class="col-12 mt-2">
                        <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold">REGISTRAR EGRESO Y SUMAR STOCK</button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <section id="inventario" class="section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Inventario</h4>
            <button class="btn btn-dark fw-bold" onclick="openCreateModal()">+ NUEVO PRODUCTO</button>
        </div>
        <div class="card p-0 overflow-hidden"><div class="table-responsive"><table class="table table-hover mb-0 text-center"><thead class="table-dark"><tr><th>PRODUCTO</th><th>STOCK</th><th>MINORISTA</th><th>MAYORISTA</th><th>ACCIONES</th></tr></thead><tbody id="inventoryTableBody"></tbody></table></div></div>
    </section>

    <section id="historial" class="section">
        <div id="historyTabs" class="mb-3">
            <button class="btn btn-outline-primary active" onclick="loadSales()">Ventas</button>
            <button class="btn btn-outline-danger" onclick="loadPurchases()">Compras (Egresos)</button>
        </div>
        <div class="card p-0 overflow-hidden"><div class="table-responsive"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>Fecha</th><th>Detalle</th><th>Cant.</th><th>Monto</th><th>Acción</th></tr></thead><tbody id="historyTableBody"></tbody></table></div></div>
    </section>
</div>

<div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0"><h5 class="modal-title fw-bold" id="modalTitle">Producto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-4">
                <form id="productForm">
                    <input type="hidden" id="p-id">
                    <div class="mb-3"><label class="small fw-bold">Nombre</label><input type="text" id="p-name" class="form-control" required></div>
                    <div class="row g-2 mb-3">
                        <div class="col-6"><label class="small fw-bold">Costo Pack</label><input type="number" id="p-packCost" class="form-control" step="0.01" required></div>
                        <div class="col-6"><label class="small fw-bold">Unidades x Pack</label><input type="number" id="p-units" class="form-control" required></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6"><label class="small fw-bold text-success">% Margen</label><input type="number" id="p-margin" class="form-control" value="50"></div>
                        <div class="col-6"><label class="small fw-bold text-danger">Stock</label><input type="number" id="p-stock" class="form-control" required></div>
                    </div>
                    <div class="row g-2 mb-3 p-2 rounded" style="background-color: #f0f9ff; border: 1px dashed #0ea5e9;">
                        <div class="col-6"><label class="small fw-bold">Precio May.</label><input type="number" id="p-wholesalePrice" class="form-control" step="0.01"></div>
                        <div class="col-6"><label class="small fw-bold">Min May.</label><input type="number" id="p-wholesaleThreshold" class="form-control"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">GUARDAR</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content border-0 shadow text-center" style="border-radius: 20px;"><div class="modal-body p-4"><h5 class="fw-bold">¿Seguro?</h5><p class="text-muted small" id="confirmText"></p><div class="d-grid gap-2 mt-4"><button type="button" class="btn btn-danger fw-bold" id="btnConfirmDelete">ELIMINAR</button><button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button></div></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
</body>
</html>
