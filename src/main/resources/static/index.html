<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bella Afrodita | Management Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #db2777;
            --primary-soft: #fdf2f8;
            --secondary: #6366f1;
            --dark: #0f172a;
            --sidebar-width: 260px;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --nav-height: 70px;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--dark);
            margin: 0;
            overflow-x: hidden;
        }

        /* --- RESPONSIVE LAYOUT LOGIC --- */
        @media (min-width: 992px) {
            .sidebar {
                width: var(--sidebar-width);
                background: var(--dark);
                height: 100vh;
                position: fixed;
                left: 0;
                top: 0;
                display: flex !important;
                flex-direction: column;
                padding: 1.5rem;
                z-index: 1000;
            }
            .main-content { margin-left: var(--sidebar-width); padding: 2rem; }
            .mobile-nav { display: none !important; }
        }

        @media (max-width: 991px) {
            .sidebar { display: none !important; }
            .main-content { 
                padding: 1rem; 
                padding-bottom: calc(var(--nav-height) + 40px); 
            }
            /* Menú inferior para celular */
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: var(--nav-height);
                background: white;
                display: flex !important;
                justify-content: space-around;
                align-items: center;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
                z-index: 1050;
                border-top: 1px solid #e2e8f0;
            }
        }

        /* --- NAV ELEMENTS --- */
        .nav-link, .mobile-nav-item {
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-link {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .nav-link:hover, .nav-link.active { color: white; background: var(--primary); }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 600;
            flex: 1;
        }
        .mobile-nav-item i { font-size: 1.4rem; margin-bottom: 2px; }
        .mobile-nav-item.active { color: var(--primary); }

        /* --- UI COMPONENTS --- */
        .section { display: none; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card, .stat-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .stat-card { padding: 1.2rem; transition: transform 0.2s; }
        .icon-box {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 0.8rem;
        }

        /* Ajuste de KPI en móvil para que entren de a 2 */
        @media (max-width: 576px) {
            .stat-card { padding: 0.8rem; }
            .stat-card h2 { font-size: 1rem; }
            .stat-card small { font-size: 0.6rem; }
            .icon-box { width: 32px; height: 32px; margin-bottom: 0.4rem; font-size: 0.9rem; }
        }

        .search-container {
            position: relative;
            background: #f8fafc;
            border-radius: 15px;
            width: 100%;
        }

        .search-container input {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 12px 12px 12px 45px;
            height: 50px;
            width: 100% !important;
        }

        .search-container .bi-search {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        /* --- BOTÓN FLOTANTE (FAB) --- */
        .btn-fab {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--dark);
            color: white;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            border: none;
        }
        @media (max-width: 991px) { .btn-fab { display: flex; } }

        /* Estilos de tabla en móvil */
        .table-responsive { border-radius: 15px; }
        @media (max-width: 768px) {
            .table th:nth-child(4), .table td:nth-child(4) { display: none; } /* Ocultar precio mayorista en celu */
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="d-flex align-items-center mb-5 px-2">
        <div class="bg-primary rounded-3 p-2 me-3">
            <i class="bi bi-gem text-white fs-4"></i>
        </div>
        <span class="text-white fw-bold fs-5 tracking-tight">BELLA AFRODITA</span>
    </div>

    <nav>
        <div class="nav-link active" id="link-inicio" onclick="BellaAfrodita.showSection('inicio')">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </div>
        <div class="nav-link" id="link-inventario" onclick="BellaAfrodita.showSection('inventario')">
            <i class="bi bi-box-seam-fill"></i> Inventario
        </div>
        <div class="nav-link" id="link-compras" onclick="BellaAfrodita.showSection('compras')">
            <i class="bi bi-cart-download-fill"></i> Abastecimiento
        </div>
        <div class="nav-link" id="link-historial" onclick="BellaAfrodita.showSection('historial')">
            <i class="bi bi-clock-history"></i> Reportes
        </div>
    </nav>

    <div class="mt-auto">
        <div class="p-3 bg-dark rounded-4 border border-secondary border-opacity-25">
            <small class="text-muted d-block mb-1">BaezPOS v2.0</small>
            <div class="text-white small fw-semibold">Alexander | Architect</div>
        </div>
    </div>
</aside>

<nav class="mobile-nav">
    <div class="mobile-nav-item active" id="m-link-inicio" onclick="BellaAfrodita.showSection('inicio')">
        <i class="bi bi-house-door"></i><span>Inicio</span>
    </div>
    <div class="mobile-nav-item" id="m-link-inventario" onclick="BellaAfrodita.showSection('inventario')">
        <i class="bi bi-box-seam"></i><span>Stock</span>
    </div>
    <div class="mobile-nav-item" id="m-link-compras" onclick="BellaAfrodita.showSection('compras')">
        <i class="bi bi-cart-plus"></i><span>Abast.</span>
    </div>
    <div class="mobile-nav-item" id="m-link-historial" onclick="BellaAfrodita.showSection('historial')">
        <i class="bi bi-receipt"></i><span>Reportes</span>
    </div>
</nav>

<button class="btn-fab" onclick="BellaAfrodita.openCreateModal()" id="fab-add">
    <i class="bi bi-plus-lg fs-4"></i>
</button>

<main class="main-content">
    <section id="inicio" class="section active">
        <header class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold mb-1">Panel</h2>
                <p class="text-muted mb-0 small">Hola, <span class="text-primary fw-semibold">My Bella Afrodita</span></p>
            </div>
            <div class="text-end">
                <span class="badge bg-white text-dark shadow-sm p-2 border" id="current-date"></span>
            </div>
        </header>

        <div class="row g-2 g-md-4 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="icon-box bg-success bg-opacity-10 text-success"><i class="bi bi-wallet2"></i></div>
                    <small class="text-muted fw-bold">NETO</small>
                    <h2 class="fw-bold mb-0 mt-1" id="net-balance">$0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="icon-box bg-primary bg-opacity-10 text-primary"><i class="bi bi-cash-stack"></i></div>
                    <small class="text-muted fw-bold">TOTAL</small>
                    <h2 class="fw-bold mb-0 mt-1" id="total-recap">$0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="icon-box bg-danger bg-opacity-10 text-danger"><i class="bi bi-arrow-down"></i></div>
                    <small class="text-muted fw-bold">GASTOS</small>
                    <h2 class="fw-bold mb-0 mt-1" id="total-expenses">$0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="icon-box bg-info bg-opacity-10 text-info"><i class="bi bi-bag"></i></div>
                    <small class="text-muted fw-bold">VENTAS</small>
                    <h2 class="fw-bold mb-0 mt-1" id="sales-count">0</h2>
                </div>
            </div>
        </div>

        <div class="glass-card p-3 p-md-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-lightning-charge-fill text-primary"></i> Venta Rápida</h6>
            <form id="saleForm" class="row g-2">
                <div class="col-12 col-md-7 position-relative">
                    <div class="search-container">
                        <i class="bi bi-search"></i>
                        <input type="text" id="saleSearchProduct" class="form-control" placeholder="Buscar producto..." autocomplete="off">
                        <div id="productResults" class="list-group d-none shadow-lg position-absolute w-100 mt-2 z-3"></div>
                    </div>
                    <input type="hidden" id="productSelect">
                </div>
                <div class="col-4 col-md-2">
                    <input type="number" id="quantity" class="form-control h-100 text-center fw-bold" value="1" min="1" style="border-radius: 15px;">
                </div>
                <div class="col-8 col-md-3">
                    <button type="submit" class="btn btn-primary w-100 h-100 fw-bold shadow-sm" style="border-radius: 15px;">COBRAR</button>
                </div>
                <div id="selectedProductLabel" class="col-12 d-none">
                    <div class="p-2 bg-light rounded-3 text-center small fw-bold" id="currentSelectionName"></div>
                </div>
            </form>
        </div>
    </section>

    <section id="inventario" class="section">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Stock</h3>
            <button class="btn btn-dark d-none d-lg-block" onclick="BellaAfrodita.openCreateModal()">+ Nuevo</button>
        </div>
        <div class="glass-card">
            <div class="p-2 border-bottom">
                <div class="search-container">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchInventory" placeholder="Filtrar inventario...">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr><th>Producto</th><th class="text-center">Stock</th><th class="text-center">Precio</th><th class="text-end">Acción</th></tr>
                    </thead>
                    <tbody id="inventoryTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="compras" class="section">
        <h3 class="fw-bold mb-4">Abastecimiento</h3>
        <div class="glass-card p-4">
            <form id="purchaseForm" class="row g-3">
                <div class="col-12 position-relative">
                    <label class="small fw-bold">Producto</label>
                    <div class="search-container">
                        <i class="bi bi-search"></i>
                        <input type="text" id="purchaseSearchProduct" class="form-control" placeholder="Buscar para sumar..." autocomplete="off">
                        <div id="purchaseProductResults" class="list-group d-none shadow-lg position-absolute w-100 mt-2 z-3"></div>
                    </div>
                    <input type="hidden" id="purchaseProductSelect">
                </div>
                <div class="col-6">
                    <label class="small fw-bold">Packs</label>
                    <input type="number" id="purchasePacks" class="form-control" style="border-radius:12px;">
                </div>
                <div class="col-6">
                    <label class="small fw-bold">Costo Total</label>
                    <input type="number" id="purchaseTotalCost" class="form-control" style="border-radius:12px;">
                </div>
                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold mt-4" style="border-radius:15px;">CARGAR STOCK</button>
            </form>
        </div>
    </section>

    <section id="historial" class="section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="btn-group bg-white p-1 rounded-3 shadow-sm">
                <button class="btn btn-primary active btn-sm px-3" id="btnHistorialVentas" onclick="BellaAfrodita.toggleHistorial('ventas')">Ventas</button>
                <button class="btn btn-white btn-sm px-3" id="btnHistorialCompras" onclick="BellaAfrodita.toggleHistorial('compras')">Compras</button>
            </div>
            <input type="date" id="filterDate" class="form-control border-0 shadow-sm w-auto">
        </div>
        <div class="glass-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead id="historialHeader"></thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="fw-bold mb-0" id="modalTitle">Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="productForm" class="row g-3">
                    <input type="hidden" id="p-id">
                    <div class="col-12">
                        <label class="form-label small fw-bold">NOMBRE</label>
                        <input type="text" id="p-name" class="form-control bg-light border-0" required style="border-radius: 12px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">COSTO PACK</label>
                        <input type="number" step="0.01" id="p-packCost" class="form-control bg-light border-0" required style="border-radius: 12px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">U. X PACK</label>
                        <input type="number" id="p-units" class="form-control bg-light border-0" required style="border-radius: 12px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">% GANANCIA</label>
                        <input type="number" id="p-margin" class="form-control bg-light border-0" required style="border-radius: 12px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">STOCK</label>
                        <input type="number" id="p-stock" class="form-control bg-light border-0" required style="border-radius: 12px;">
                    </div>
                    <div class="col-12">
                        <div class="p-3 rounded-4 text-center" style="background: var(--primary-soft);">
                            <span class="small fw-bold text-primary">PRECIO SUGERIDO: </span>
                            <span id="live-price-preview" class="h5 fw-bold text-primary mb-0">$0.00</span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mt-3 shadow" style="border-radius: 15px;">GUARDAR</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // PEQUEÑO AJUSTE AL JS PARA MANEJAR LA NAVEGACIÓN DUAL (PC/MÓVIL)
    // Asumo que tu objeto global se llama BellaAfrodita
    const originalShowSection = BellaAfrodita.showSection;
    
    BellaAfrodita.showSection = function(id) {
        // Ejecutar la lógica original
        originalShowSection(id);
        
        // Sincronizar Sidebar (PC)
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        const pcLink = document.getElementById('link-' + id);
        if(pcLink) pcLink.classList.add('active');
        
        // Sincronizar Barra Inferior (Móvil)
        document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
        const mobileLink = document.getElementById('m-link-' + id);
        if(mobileLink) mobileLink.classList.add('active');

        // Mostrar/Ocultar botón flotante según la sección
        const fab = document.getElementById('fab-add');
        if(id === 'inventario') fab.style.display = 'flex';
        else fab.style.display = 'none';
        
        window.scrollTo(0,0);
    };

    // Inicializar fecha
    document.getElementById('current-date').innerText = new Date().toLocaleDateString();
</script>
<script src="index.js"></script>
</body>
</html>
